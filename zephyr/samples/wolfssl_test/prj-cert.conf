# Every certificate and PKCS#7 option at once, as a certificate-management
# consumer needs them. Layered on top of prj.conf.

CONFIG_WOLFSSL_KEY_GEN=y
CONFIG_WOLFSSL_CERT_GEN=y
CONFIG_WOLFSSL_CERT_REQ=y
CONFIG_WOLFSSL_CERT_EXT=y
CONFIG_WOLFSSL_ALT_NAMES=y
CONFIG_WOLFSSL_IP_ALT_NAME=y
CONFIG_WOLFSSL_CERT_NAME_ALL=y
CONFIG_WOLFSSL_PUBLIC_ASN=y
CONFIG_WOLFSSL_KEEP_PEER_CERT=y
CONFIG_WOLFSSL_PKCS7=y
CONFIG_WOLFSSL_CURVE25519=y
CONFIG_WOLFSSL_ED25519=y
CONFIG_WOLFSSL_CURVE448=y
CONFIG_WOLFSSL_ED448=y
CONFIG_WOLFSSL_POST_HANDSHAKE_AUTH=y

# IP_ALT_NAME needs the socket address types.
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y

CONFIG_MAIN_STACK_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072

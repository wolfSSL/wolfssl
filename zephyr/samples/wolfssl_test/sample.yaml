sample:
  description: wolfCrypt test sample app
  name: wolfCrypt test
common:
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Exiting main with return code: 0"
tests:
  sample.crypto.wolfssl_test:
    timeout: 120
    platform_allow: qemu_x86
    integration_platforms:
      - qemu_x86
  sample.crypto.wolfssl_test_no_malloc:
    timeout: 200
    platform_allow: qemu_x86
    extra_args: CONF_FILE="prj-no-malloc.conf"
    integration_platforms:
      - qemu_x86
  sample.crypto.wolfssl_test_ecc_nist:
    timeout: 400
    platform_allow: qemu_x86
    extra_args: CONF_FILE="prj.conf;prj-ecc-nist.conf"
    integration_platforms:
      - qemu_x86
  sample.crypto.wolfssl_test_ecc_custom:
    # Brainpool forces the generic SP backend, which is slower than the
    # per-curve one, and this runs the whole suite over every curve under QEMU.
    timeout: 600
    platform_allow: qemu_x86
    extra_args: CONF_FILE="prj.conf;prj-ecc-custom.conf"
    integration_platforms:
      - qemu_x86
  # One scenario per assembly port CONFIG_WOLFCRYPT_ASM can select, so a
  # regression in the generated sources or in the arch dispatch fails here
  # rather than on hardware.
  sample.crypto.wolfssl_test_asm_x86_64:
    # qemu_x86_64 advertises no AVX, so this also exercises the CPUID fallback
    # that keeps the Intel sources off a CPU whose OS never enabled the vector
    # state.
    timeout: 400
    platform_allow: qemu_x86_64
    extra_configs:
      - CONFIG_WOLFCRYPT_ASM=y
      - CONFIG_MAIN_STACK_SIZE=65536
      - CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
    integration_platforms:
      - qemu_x86_64
  sample.crypto.wolfssl_test_asm_aarch64:
    # The ARMv8 symmetric port plus the ARM64 math one, at the board's own
    # -mcpu. Plain ARMv8-A has no crypto extension, so user_settings.h opts out
    # of the hardware paths and this covers the software ones.
    timeout: 900
    platform_allow: qemu_cortex_a53
    extra_configs:
      - CONFIG_WOLFCRYPT_ASM=y
      - CONFIG_MAIN_STACK_SIZE=65536
      - CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
    integration_platforms:
      - qemu_cortex_a53
  sample.crypto.wolfssl_test_asm_aarch64_crypto:
    # The same port with the crypto extension named, which is what turns the
    # hardware paths on. Covers the .arch_extension directives the generated
    # files carry, which a plain ARMv8-A -mcpu rejects without them.
    timeout: 900
    platform_allow: qemu_cortex_a53
    extra_configs:
      - CONFIG_WOLFCRYPT_ASM=y
      - CONFIG_MAIN_STACK_SIZE=65536
      - CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
      - CONFIG_COMPILER_OPT="-mcpu=cortex-a53+crypto"
    integration_platforms:
      - qemu_cortex_a53
  sample.crypto.wolfssl_test_asm_thumb2:
    # AN521 is a Cortex-M33, so this is the Thumb2 symmetric port plus the
    # Cortex-M math one - the pair every ARMv8-M mainline target takes.
    timeout: 1800
    platform_allow: mps2/an521/cpu0
    extra_configs:
      - CONFIG_WOLFCRYPT_ASM=y
      - CONFIG_MAIN_STACK_SIZE=65536
      - CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
    integration_platforms:
      - mps2/an521/cpu0

# The custom-curve path: Brainpool requires WOLFSSL_CUSTOM_CURVES, which
# cannot coexist with the per-curve SP backend, so the module moves the whole
# build onto the generic one. Covers the 512 size, which exists only for
# brainpoolP512r1. Layered on top of prj.conf via CONF_FILE in sample.yaml.

CONFIG_WOLFSSL_ECC=y
CONFIG_WOLFSSL_ECC_256=y
CONFIG_WOLFSSL_ECC_384=y
CONFIG_WOLFSSL_ECC_512=y
CONFIG_WOLFSSL_ECC_BRAINPOOL=y

CONFIG_MAIN_STACK_SIZE=65536

# The generic backend allocates more per operation than the per-curve one.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# P-256 plus the two larger NIST curves, WITHOUT any custom-curve option.
#
# This combination is the one worth pinning: each larger curve needs its own
# SP implementation switch, and selecting the curve alone leaves it in
# wolfCrypt's table with no math behind it - a build that succeeds and then
# fails at runtime with WC_KEY_SIZE_E. Enabling Brainpool here would mask
# exactly that, because it forces the generic SP backend, which handles every
# curve.
# Layered on top of prj.conf via CONF_FILE in sample.yaml.

CONFIG_WOLFSSL_ECC=y
CONFIG_WOLFSSL_ECC_256=y
CONFIG_WOLFSSL_ECC_384=y
CONFIG_WOLFSSL_ECC_521=y

# P-521's SP path is markedly more stack-hungry than the smaller curves.
CONFIG_MAIN_STACK_SIZE=65536

# PKCS12 in the full suite needs more heap than the base sample allows.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

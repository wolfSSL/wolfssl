# Configure stack and heap sizes. The arena must hold the benchmark thread
# stack that HAVE_STACK_SIZE allocates (WOLFSSL_ZEPHYR_STACK_SZ, 48 KB by
# default) plus the k_thread object, leaving about 16 KB for the benchmark's
# own allocations. Raise this if WOLFSSL_ZEPHYR_STACK_SZ is increased.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# TLS configuration
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y

# Floating Point
CONFIG_FPU=y

# Logging
CONFIG_PRINTK=y
CONFIG_CBPRINTF_LIBC_SUBSTS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=15360
CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_WOLFSSL_DEBUG=y

# Entropy
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Optional ARM or Intel Assembly
#CONFIG_WOLFCRYPT_ARMASM=y
#CONFIG_WOLFCRYPT_INTELASM=y

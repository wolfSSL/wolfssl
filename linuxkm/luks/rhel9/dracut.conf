# Open encrypted volumes in the initramfs, including root, only through wolfCrypt.
add_drivers+=" libwolfssl "
install_items+=" /usr/local/sbin/wolfcrypt-luks-guard /etc/wolfcrypt-luks.conf /usr/bin/awk /usr/bin/gawk /etc/systemd/system/wolfcrypt-luks-guard.service /etc/systemd/system/systemd-cryptsetup@.service.d/wolfcrypt.conf /etc/systemd/system/cryptsetup.target.wants/wolfcrypt-luks-guard.service "

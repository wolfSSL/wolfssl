name: Membrowse Comment

on:
  workflow_run:
    workflows: [Membrowse Memory Report]
    types:
      - completed

jobs:
  post-comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Run the comment job even if some of the builds fail
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Post Membrowse PR comment
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        # Pinned to a full commit SHA, same rationale as the report
        # workflow. v1.2.15.
        uses: membrowse/membrowse-action/comment-action@34719bdb04722be5cbe9c1d6df4a1567ae98238d
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

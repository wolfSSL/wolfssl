name: libimobiledevice Tests

# START OF COMMON SECTION
on:
  push:
    branches: [ 'release/**' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ '*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
# END OF COMMON SECTION

jobs:
  build_wolfssl:
    name: Build wolfSSL
    if: ${{ (github.repository_owner == 'wolfssl') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    # Just to keep it the same as the testing target
    runs-on: ubuntu-24.04
    # This should be a safe limit for the tests to run.
    timeout-minutes: 4
    steps:
      - name: Build wolfSSL
        uses: wolfSSL/actions-build-autotools-project@v1
        with:
          path: wolfssl
          configure: --enable-all --enable-tlsv10
          install: true
          check: false

      - name: tar build-dir
        run: tar -zcf build-dir.tgz build-dir

      - name: Upload built lib
        uses: actions/upload-artifact@v6
        with:
          name: wolf-install-libimobiledevice
          path: build-dir.tgz
          retention-days: 5

  libimobiledevice_check:
    strategy:
      fail-fast: false
      matrix:
        # List of releases to test
        include:
          - ref: 1.4.0
            libplist: 2.7.0
            glue: 1.3.2
            libusbmuxd: 2.1.1
            libtatsu: 1.0.5
    name: ${{ matrix.ref }}
    if: ${{ (github.repository_owner == 'wolfssl') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    # This should be a safe limit for the tests to run.
    timeout-minutes: 15
    needs: build_wolfssl
    steps:
      - name: Checkout wolfSSL CI actions
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts
          fetch-depth: 1

      - name: Download lib
        uses: actions/download-artifact@v7
        with:
          name: wolf-install-libimobiledevice

      - name: untar build-dir
        run: tar -xf build-dir.tgz

      - name: Install dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          packages: libusb-1.0-0-dev libcurl4-openssl-dev libreadline-dev python3-cryptography
          ghcr-debs-tag: ubuntu-24.04-full

      - name: Checkout OSP
        uses: actions/checkout@v5
        with:
          repository: wolfssl/osp
          path: osp
          fetch-depth: 1

      # The Ubuntu packages are too old (libtatsu needs libplist >= 2.6.0)
      # and libimobiledevice-glue/libtatsu are not packaged, so build the
      # dependency chain from source into the wolfSSL prefix. None of these
      # use OpenSSL or wolfSSL.
      - name: Checkout libplist
        uses: actions/checkout@v5
        with:
          repository: libimobiledevice/libplist
          path: libplist
          ref: ${{ matrix.libplist }}
          fetch-depth: 1

      - name: Checkout libimobiledevice-glue
        uses: actions/checkout@v5
        with:
          repository: libimobiledevice/libimobiledevice-glue
          path: libimobiledevice-glue
          ref: ${{ matrix.glue }}
          fetch-depth: 1

      - name: Checkout libusbmuxd
        uses: actions/checkout@v5
        with:
          repository: libimobiledevice/libusbmuxd
          path: libusbmuxd
          ref: ${{ matrix.libusbmuxd }}
          fetch-depth: 1

      - name: Checkout libtatsu
        uses: actions/checkout@v5
        with:
          repository: libimobiledevice/libtatsu
          path: libtatsu
          ref: ${{ matrix.libtatsu }}
          fetch-depth: 1

      - name: Checkout libimobiledevice
        uses: actions/checkout@v5
        with:
          repository: libimobiledevice/libimobiledevice
          path: libimobiledevice
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Build dependencies
        run: |
          export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build-dir/lib/pkgconfig
          for dep in libplist libimobiledevice-glue libusbmuxd libtatsu; do
            pushd $dep
            ./autogen.sh --prefix=$GITHUB_WORKSPACE/build-dir --without-cython
            make -j
            make install
            popd
          done

      - name: Build libimobiledevice
        working-directory: libimobiledevice
        run: |
          export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build-dir/lib/pkgconfig
          patch -p1 < $GITHUB_WORKSPACE/osp/libimobiledevice/${{ matrix.ref }}.patch
          ./autogen.sh --prefix=$GITHUB_WORKSPACE/build-dir --enable-wolfssl --without-cython
          make -j
          make install

      # libimobiledevice has no test suite and a runner has no iOS device.
      # .github/scripts/idevice-emulator.py plays one: it serves the usbmuxd
      # socket named by USBMUXD_SOCKET_ADDRESS and the lockdownd service
      # behind it, checks the pair record the tools generate through wolfSSL
      # and requires the session TLS. The second run reports iOS 9, for which
      # libimobiledevice pins the session to TLS 1.0 (needs --enable-tlsv10).
      - name: Test libimobiledevice
        env:
          UDID: 1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b
          USBMUXD_SOCKET_ADDRESS: UNIX:/tmp/idevice-emulator.sock
        run: |
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build-dir/lib
          bin=$GITHUB_WORKSPACE/build-dir/bin
          ldd $GITHUB_WORKSPACE/build-dir/lib/libimobiledevice-1.0.so | grep wolfssl
          ldd $bin/idevicepair | grep wolfssl

          run_against_emulator() {
            local version=$1 want_tls=$2 emulator i devices
            local log=/tmp/idevice-emulator-$version.log
            rm -f /tmp/idevice-emulator.sock
            python3 .github/scripts/idevice-emulator.py \
              --socket /tmp/idevice-emulator.sock --log $log \
              --udid $UDID --product-version $version &
            emulator=$!
            for i in $(seq 1 100); do
              [ -S /tmp/idevice-emulator.sock ] && break
              sleep 0.1
            done

            # Assign on its own line: a command substitution inside test,
            # or inside a `local` declaration, would discard idevice_id's
            # exit status.
            devices=$($bin/idevice_id -l)
            test "$devices" = "$UDID"
            $bin/idevicepair pair
            $bin/idevicepair validate
            $bin/ideviceinfo | grep "^ProductVersion: $version\$"
            $bin/idevicepair unpair

            # Also checks that the emulator exits cleanly on SIGTERM.
            kill $emulator
            wait $emulator

            # What the emulator saw: pair record OK, session over the expected
            # TLS version with the RootCertificate as client certificate,
            # requests served inside it, unpair reached the record store.
            grep -q 'pair: pair record verified: ' $log
            grep -q 'private keys match their certificates' $log
            grep -qE "tls: session established version=$want_tls" $log
            grep -q 'matches RootCertificate from the pair record' $log
            grep -q 'lockdown: GetValue .* \[session ' $log
            grep -q 'usbmux: DeletePairRecord .* -> deleted' $log
            if grep -qE 'REJECTED|NOT the RootCertificate' $log; then
              exit 1
            fi
          }

          run_against_emulator 18.6 'TLSv1\.[23] '
          run_against_emulator 9.3 'TLSv1 '

      - name: Emulator logs
        if: always()
        run: |
          for log in /tmp/idevice-emulator-*.log; do
            [ -f "$log" ] || continue
            echo "=== $log ==="
            cat "$log"
          done

name: "Microchip PolarFire SoC Athena port"

# Keeps the PolarFire SoC Athena F5200 crypto callback port compiling against
# the real Microchip CAL. The port is only built when --with-mpfs-athena names a
# CAL directory, so no other job compiles a line of it: without this guard a
# rename in the CAL headers, or a refactor in aes.c, sha512.c or cryptocb.h,
# would break it silently until someone next built for the board.
#
# Nothing is faked: the CAL ships in a public GitHub repository, headers and
# archive both, so this compiles against the genuine vendor headers at a pinned
# commit and then checks that every CAL symbol the port references is really
# defined in the archive.
#
# The compile is a host build, not a cross build, which is a deliberate choice.
# Both CAL archives are soft-float lp64, and Ubuntu's riscv64 glibc is built
# lp64d only - there is no gnu/stubs-lp64.h - so -mabi=lp64 cannot be satisfied
# by crossbuild-essential-riscv64, and a bare-metal toolchain would make this
# job depend on how a libc happens to be packaged. None of that is what the job
# is guarding: the breakage it catches is a CAL header rename, or a refactor in
# aes.c, sha512.c or cryptocb.h, and the host compiler sees all of it. The
# target ABI is proven by building for the board, not here.
#
# Functional correctness is validated on an MPFS250TS Video Kit; see
# wolfcrypt/src/port/microchip/README.md.

# START OF COMMON SECTION
on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
    paths:
      - 'wolfcrypt/src/**'
      - 'wolfssl/wolfcrypt/**'
      - '.github/workflows/mpfs-athena-compile.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ '**' ]
    paths:
      - 'wolfcrypt/src/**'
      - 'wolfssl/wolfcrypt/**'
      - '.github/workflows/mpfs-athena-compile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
# END OF COMMON SECTION

env:
  # Pinned so a CAL change cannot break a PR that did not touch the port. Bump
  # it deliberately.
  HSS_REF: 19c8c0dbc0b37ae3b1197f6e817d2d766ad2af87

jobs:
  compile:
    name: ${{ matrix.leg }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both engines, which is the ordinary build.
          - leg: sha384-and-aesctr
            extra: ''
          # The port advertises independent algorithm gates, so each has to
          # build on its own: an AES-only build has no WC_SHA384_DIGEST_SIZE,
          # and a SHA-only build compiles no cipher path.
          - leg: aesctr-only
            extra: '-UWOLFSSL_SHA384 -UWOLFSSL_SHA512'
          - leg: sha384-only
            extra: '-UWOLFSSL_AES_COUNTER'
          - leg: no-selftest
            extra: '-DWC_MPFS_ATHENA_NO_SELFTEST'
    steps:
      - uses: actions/checkout@v4
        name: Checkout wolfSSL

      - name: Checkout the Microchip CAL
        run: |
          set -e
          # Only services/crypto is needed, and the repository is large.
          git clone --filter=blob:none --no-checkout --sparse \
            https://github.com/polarfire-soc/hart-software-services \
            "$GITHUB_WORKSPACE/hss"
          cd "$GITHUB_WORKSPACE/hss"
          git sparse-checkout set services/crypto
          git fetch --depth 1 origin "$HSS_REF"
          git checkout "$HSS_REF"
          test -f services/crypto/calini.h
          test -f services/crypto/mpfs-rv64imac-user-crypto-lib.a

      - name: Compile the port
        run: |
          set -e
          CAL="$GITHUB_WORKSPACE/hss/services/crypto"
          mkdir -p "$GITHUB_WORKSPACE/cfg"

          # Minimal configuration: enough to reach both engines in the port.
          cat > "$GITHUB_WORKSPACE/cfg/user_settings.h" <<'EOF'
          #ifndef CI_USER_SETTINGS_H
          #define CI_USER_SETTINGS_H
          #define WOLFSSL_MICROCHIP_MPFS
          #define WOLFSSL_MPFS_ATHENA
          #define WOLFSSL_SHA512
          #define WOLFSSL_SHA384
          #define WOLFSSL_AES_COUNTER
          /* Deliberately NOT WOLFSSL_AES_DIRECT: the port must not depend on
           * it, since wc_AesSetKeyDirect is declared only when it is set. */
          #define SINGLE_THREADED
          #define NO_FILESYSTEM
          #define NO_WOLFSSL_DIR
          /* The first targets have no heap, so this is the static-pool leg. */
          #define WOLFSSL_NO_MALLOC
          #define NO_WOLFSSL_MEMORY
          #define WC_NO_HARDEN
          #define NO_BIG_INT
          #define NO_RSA
          #define NO_DH
          #define NO_DSA
          #endif
          EOF

          cc -c \
            -Wall -Wextra -Werror \
            -I. -I"$GITHUB_WORKSPACE/cfg" -I"$CAL" \
            -DWOLFSSL_USER_SETTINGS ${{ matrix.extra }} \
            wolfcrypt/src/port/microchip/mpfs_athena.c \
            -o "$GITHUB_WORKSPACE/mpfs_athena.o"

      - name: Check every CAL symbol resolves in the archive
        run: |
          set -e
          CAL="$GITHUB_WORKSPACE/hss/services/crypto"
          OBJ="$GITHUB_WORKSPACE/mpfs_athena.o"
          # nm reads the rv64 archive on any host: ELF is ELF.
          nm --defined-only \
            "$CAL/mpfs-rv64imac-user-crypto-lib.a" \
            | awk '{print $3}' | sort -u > /tmp/cal_defined

          # A missing CAL symbol is a link error on the board but compiles
          # cleanly here, so it has to be checked explicitly.
          missing=0
          for sym in $(nm --undefined-only "$OBJ" \
                         | awk '{print $2}' | grep -E '^(CAL|aesf5200|shaf5200)'); do
              if grep -qx "$sym" /tmp/cal_defined; then
                  echo "  ok      $sym"
              else
                  echo "  MISSING $sym"
                  missing=1
              fi
          done
          test "$missing" -eq 0

      - name: Confirm the port was actually compiled in
        run: |
          set -e
          # An empty object means a gate compiled the whole port out, which has
          # happened: without WOLF_CRYPTO_CB the file is one big #if.
          nm --defined-only "$GITHUB_WORKSPACE/mpfs_athena.o" \
            | grep -q 'wc_MpfsAthena_CryptoDevCb'

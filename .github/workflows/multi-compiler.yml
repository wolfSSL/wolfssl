name: Multiple compilers and versions

# START OF COMMON SECTION
on:
  push:
    branches: [ 'release/**' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ '*' ]
  # Weekday-morning cron (10:00 UTC) seeds the master-scoped ccache that PR runs
  # restore: re-runs --build-only (compile only, no tests) on the
  # default branch. PR runs are read-only (see ccache-setup).
  schedule:
    - cron: '24 10 * * 1-5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
# END OF COMMON SECTION

jobs:
  # All former runner-per-config matrix entries build on one runner via
  # .github/scripts/parallel-make-check.py (see os-check.yml for the full
  # pattern): each config builds in its own out-of-tree ("VPATH") build
  # directory off one checkout/autogen, on a pool of one-per-CPU worker
  # threads, longest first.
  my_matrix:
    name: Compiler test
    if: ${{ (github.repository_owner == 'wolfssl') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    # Generous for a cold ccache; warm reruns finish in a fraction.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        name: Checkout wolfSSL

      - name: Install dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          packages: autoconf automake libtool build-essential gcc-9 g++-9 gcc-10 g++-10 gcc-11 g++-11 gcc-12 g++-12 clang-14 clang-19 gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          ghcr-debs-tag: ubuntu-24.04-minimal

      # ccache via the cross-platform composite; the script passes the
      # compiler to configure as CC="ccache gcc" (or a per-config "cc").
      - name: Set up ccache
        uses: ./.github/actions/ccache-setup
        with:
          workflow-id: multi-compiler
          read-only: ${{ github.event_name == 'pull_request' }}
          max-size: 500M

      # One entry per compiler (the former one-runner-per-compiler matrix):
      # default-config build plus "make dist", with the compiler routed
      # through ccache via the per-config "cc" key. CXX rides along as a
      # configure argument.
      #
      # The "--link" check-forcezero-dse.sh legs below (gcc-12, clang-19)
      # compile dse_probe.c with a per-TU -DWOLFSSL_NO_ASM and link it
      # against libwolfssl.a built *without* that define. That's a
      # lib/app feature-define mismatch, but it's safe here specifically:
      # the symbol under test, wc_BarrierDataSink(), is compiled
      # unconditionally in wc_port.o regardless of WOLFSSL_NO_ASM, so the
      # link always resolves. Do not copy this pattern for a probe whose
      # target symbol's layout depends on WOLFSSL_NO_ASM (e.g. anything
      # touching tfm.h's fp_int) -- use a build dir configured with
      # --disable-asm instead.
      - name: Build all configs (parallel, out-of-tree)
        run: |
          cat > "$RUNNER_TEMP/multi-compiler-configs.json" <<'EOF'
          [
          {"name": "gcc-9", "minutes": 1.5,
           "cc": "ccache gcc-9",
           "configure": ["CXX=g++-9",
            "CFLAGS=-pedantic -Wdeclaration-after-statement -Wnull-dereference"],
           "check": false,
           "run": [["make", "dist"]]},
          {"name": "gcc-10", "minutes": 1.5,
           "cc": "ccache gcc-10",
           "configure": ["CXX=g++-10",
            "CFLAGS=-pedantic -Wdeclaration-after-statement -Wnull-dereference"],
           "check": false,
           "run": [["make", "dist"]]},
          {"name": "gcc-11", "minutes": 1.5,
           "cc": "ccache gcc-11",
           "configure": ["CXX=g++-11",
            "CFLAGS=-pedantic -Wdeclaration-after-statement -Wnull-dereference"],
           "check": false,
           "run": [["make", "dist"]]},
          {"name": "gcc-12", "minutes": 3,
           "cc": "ccache gcc-12",
           "configure": ["CXX=g++-12", "--enable-static",
            "CFLAGS=-pedantic -Wdeclaration-after-statement -Wnull-dereference"],
           "check": false,
           "run": [
            ["make", "dist"],
            ["sh", "-c",
             "../.github/scripts/check-barrier-arms.sh --builddir . --srcdir .. gcc-12"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. gcc-12 -O2"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. gcc-12 -O3"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. gcc-12 -O2 -flto -ffat-lto-objects"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. --link gcc-12 -O2 -flto -ffat-lto-objects -DWOLFSSL_NO_ASM"],
            ["sh", "-c",
             "../.github/scripts/check-sink-relro.sh --builddir . --srcdir .. gcc-12 -O2 -DWOLFSSL_NO_ASM"]
           ]},
          {"name": "mingw-w64-sink-relro", "minutes": 1.5,
           "cc": "ccache x86_64-w64-mingw32-gcc",
           "configure": ["--host=x86_64-w64-mingw32", "--disable-shared",
            "--disable-examples", "--disable-crypttests", "--disable-benchmark"],
           "check": false,
           "run": [
            ["sh", "-c",
             "../.github/scripts/check-sink-relro.sh --builddir . --srcdir .. --objdump x86_64-w64-mingw32-objdump x86_64-w64-mingw32-gcc -O2 -DWOLFSSL_NO_ASM"]
           ]},
          {"name": "clang-14", "minutes": 1.5,
           "cc": "ccache clang-14",
           "configure": ["CXX=clang++-14",
            "CFLAGS=-pedantic -Wdeclaration-after-statement -Wnull-dereference"],
           "check": false,
           "run": [["make", "dist"]]},
          {"name": "clang-19", "minutes": 2.5,
           "cc": "ccache clang-19",
           "configure": ["CXX=clang++-19", "--enable-static",
            "CFLAGS=-pedantic -Wdeclaration-after-statement -Wnull-dereference"],
           "check": false,
           "run": [
            ["make", "dist"],
            ["sh", "-c",
             "../.github/scripts/check-barrier-arms.sh --builddir . --srcdir .. clang-19"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. clang-19 -O2"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. clang-19 -O3"],
            ["sh", "-c",
             "../.github/scripts/check-forcezero-dse.sh --builddir . --srcdir .. --link clang-19 -O2 -flto -DWOLFSSL_NO_ASM"],
            ["sh", "-c",
             "../.github/scripts/check-sink-relro.sh --builddir . --srcdir .. clang-19 -O2 -DWOLFSSL_NO_ASM"]
           ]}
          ]
          EOF
          .github/scripts/parallel-make-check.py \
            ${{ github.event_name == 'schedule' && '--build-only' || '' }} \
            "$RUNNER_TEMP/multi-compiler-configs.json"

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: multi-compiler-logs
          path: |
            build-*/make-check.log
            build-*/test-suite.log
            build-*/config.log
          if-no-files-found: ignore
